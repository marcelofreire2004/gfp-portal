<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared-layout.css">
    <style>
        .content { max-width: 900px; margin: 0 auto; }
        .resumo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .resumo-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
        .resumo-card .label { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .resumo-card .valor { font-size: 1.3rem; font-weight: 800; color: var(--text); }

        .filtros { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
        .filtros input, .filtros select { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: .85rem; font-family: inherit; outline: none; }
        .filtros input { flex: 1; min-width: 200px; }

        .notif-card { background: var(--surface); border: 1px solid var(--border-light); border-left: 3px solid var(--primary); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; transition: box-shadow .15s; }
        .notif-card.processada { border-left-color: var(--success); opacity: .8; }
        .notif-card:hover { box-shadow: var(--shadow-sm); }
        .notif-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .notif-pacote { font-size: .68rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 2px 8px; border-radius: 99px; display: inline-block; }
        .notif-titulo { font-size: .92rem; font-weight: 700; color: var(--text); margin-top: 6px; }
        .notif-msg { font-size: .82rem; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }
        .notif-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: .7rem; color: var(--text-muted); }
        .badge-status { font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
        .badge-pendente { color: var(--warning); background: var(--warning-light, #FEF3C7); }
        .badge-processada { color: var(--success); background: var(--success-light); }
        .notif-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-mini { padding: 5px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); font-size: .7rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s; }
        .btn-mini:hover { background: var(--surface-hover); }
        .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: .9rem; }
    </style>
</head>
<body>
<script src="/shared-layout.js"></script>

<div class="content">
    <div style="margin-bottom:20px">
        <div style="font-size:1.3rem;font-weight:900;color:var(--text)">🔔 Notificações Recebidas</div>
        <div style="font-size:.82rem;color:var(--text-muted);margin-top:2px">Notificações capturadas do dispositivo Android</div>
    </div>

    <div class="resumo-grid">
        <div class="resumo-card"><div class="label">Total</div><div class="valor" id="stat-total">0</div></div>
        <div class="resumo-card"><div class="label">Pendentes</div><div class="valor" id="stat-pendentes" style="color:var(--warning)">0</div></div>
        <div class="resumo-card"><div class="label">Processadas</div><div class="valor" id="stat-processadas" style="color:var(--success)">0</div></div>
    </div>

    <div class="filtros">
        <input type="text" id="busca" placeholder="Buscar por pacote, título ou mensagem..." oninput="render()">
        <select id="filtro-status" onchange="render()">
            <option value="todos">Todos</option>
            <option value="pendente">Pendentes</option>
            <option value="processada">Processadas</option>
        </select>
        <button class="btn-mini" onclick="load()" title="Atualizar">🔄 Atualizar</button>
    </div>

    <div id="lista"></div>
</div>

<script>
const token = localStorage.getItem('token');
const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
let notificacoes = [];

const fmtDataHora = d => {
    if (!d) return '—';
    const dt = new Date(d);
    return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
};

async function load() {
    try {
        const res = await fetch('/notificacoes', { headers });
        notificacoes = await res.json();
        if (!Array.isArray(notificacoes)) notificacoes = [];
    } catch (e) {
        notificacoes = [];
    }
    updateStats();
    render();
}

function updateStats() {
    const total = notificacoes.length;
    const proc = notificacoes.filter(n => n.processada).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-processadas').textContent = proc;
    document.getElementById('stat-pendentes').textContent = total - proc;
}

function render() {
    const el = document.getElementById('lista');
    const busca = (document.getElementById('busca').value || '').toLowerCase();
    const status = document.getElementById('filtro-status').value;

    let itens = notificacoes;
    if (status === 'pendente') itens = itens.filter(n => !n.processada);
    else if (status === 'processada') itens = itens.filter(n => n.processada);
    if (busca) {
        itens = itens.filter(n =>
            (n.package_name || '').toLowerCase().includes(busca) ||
            (n.titulo || '').toLowerCase().includes(busca) ||
            (n.mensagem || '').toLowerCase().includes(busca)
        );
    }

    if (!itens.length) {
        el.innerHTML = '<div class="empty">Nenhuma notificação encontrada.</div>';
        return;
    }

    el.innerHTML = itens.map(n => `
        <div class="notif-card ${n.processada ? 'processada' : ''}">
            <div class="notif-head">
                <div style="flex:1;min-width:0">
                    <span class="notif-pacote">${escapeHtml(n.package_name)}</span>
                    <div class="notif-titulo">${escapeHtml(n.titulo)}</div>
                    ${n.mensagem ? `<div class="notif-msg">${escapeHtml(n.mensagem)}</div>` : ''}
                    <div class="notif-meta">
                        <span>🕒 ${fmtDataHora(n.data_recebida)}</span>
                        <span class="badge-status ${n.processada ? 'badge-processada' : 'badge-pendente'}">${n.processada ? '✅ Processada' : '⏳ Pendente'}</span>
                    </div>
                </div>
                <div class="notif-actions">
                    ${n.processada
                        ? `<button class="btn-mini" onclick="marcarProcessada(${n.id_notificacao}, false)">↩ Reabrir</button>`
                        : `<button class="btn-mini" onclick="marcarProcessada(${n.id_notificacao}, true)">✓ Processar</button>`}
                </div>
            </div>
        </div>
    `).join('');
}

async function marcarProcessada(id, processada) {
    try {
        await fetch(`/notificacoes/${id}/processada`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({ processada })
        });
        await load();
    } catch (e) {
        alert('Erro ao atualizar notificação.');
    }
}

function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

load();
</script>
</body>
</html>
